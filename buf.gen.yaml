version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/opentelemetry/opentelemetry
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/gateway/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
  # Pinned: v2 generates for connectrpc.com/connect/v2, which this module
  # does not use.
  - remote: buf.build/connectrpc/go:v1.21.0
    out: gen
    opt:
      - paths=source_relative
