version: v2beta1

vars:
  GATEWAY_NAMESPACE: platform

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      if kubectl get application gateway -n argocd >/dev/null 2>&1; then
        echo "Disabling ArgoCD auto-sync for gateway..."
        kubectl patch application gateway -n argocd \
          --type merge \
          -p '{"spec":{"syncPolicy":{"automated":null}}}'
        echo "ArgoCD auto-sync disabled."
      else
        echo "WARNING: ArgoCD Application 'gateway' not found in argocd namespace."
      fi
      echo "Patching gateway deployment for DevSpace..."
      kubectl patch deployment gateway -n ${GATEWAY_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 1000
              fsGroup: 1000
            initContainers: []
            volumes:
              - name: data
                emptyDir: {}
            containers:
              - name: gateway
                image: ghcr.io/agynio/devcontainer-go:1.1.0
                workingDir: /opt/app/data
                command:
                  - sh
                  - -c
                  - |
                    set -eu
                    start=$(date +%s)
                    while [ ! -f /opt/app/data/go.mod ] \
                      || [ ! -f /opt/app/data/go.sum ] \
                      || [ ! -f /opt/app/data/.air.toml ] \
                      || [ ! -f /opt/app/data/cmd/gateway/main.go ] \
                      || [ ! -f /opt/app/data/internal/platform/config.go ]; do
                      sleep 1
                      elapsed=$(( $(date +%s) - start ))
                      [ "$elapsed" -ge 300 ] && { echo "ERROR: sync timeout waiting for source files" >&2; exit 1; }
                    done
                    exec /opt/app/data/scripts/devspace-startup.sh
                volumeMounts:
                  - name: data
                    mountPath: /opt/app/data
                livenessProbe: null
                startupProbe: null
                resources:
                  # Requests are reservations held for the pod's whole life, but
                  # a dev container only needs its build peak briefly and then
                  # idles near 100Mi. Keeping them low lets several services run
                  # from source on one node; the limits still allow a full build.
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: "2"
                    memory: 4Gi
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  readOnlyRootFilesystem: false
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                  seccompProfile:
                    type: RuntimeDefault
      EOF
      )"
      if [ "$(get_flag "watch")" == "true" ]; then
        trap './scripts/argocd-restore.sh' EXIT
        start_dev --disable-pod-replace gateway
      else
        start_dev --disable-pod-replace gateway
        echo "Waiting for gateway to be healthy on :8080..."
        healthy=false
        for i in $(seq 1 300); do
          if kubectl exec deployment/gateway -n ${GATEWAY_NAMESPACE} -c gateway -- bash -c 'nc -z localhost 8080 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/8080) >/dev/null 2>&1' 2>/dev/null; then
            echo "Gateway is healthy on :8080."
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          echo "ERROR: Gateway did not become healthy within 600s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev gateway
      fi


  restore-argocd:
    run: |-
      ./scripts/argocd-restore.sh

dev:
  gateway:
    namespace: ${GATEWAY_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: gateway
    containers:
      gateway:
        container: gateway
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - /gen/
              - dist/
              - .devspace/
              - gateway.log
              - gateway.pid
              - bootstrap/
              - e2e/
            uploadExcludePaths:
              - .git/
              - /gen/
              - dist/
              - bootstrap/
              - e2e/
            downloadExcludePaths:
              - .git/
              - /gen/
              - dist/
              - bootstrap/
              - e2e/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "8080"
