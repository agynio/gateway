name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.1"
          github_token: ${{ github.token }}

      - name: Install grpcurl
        shell: bash
        run: |
          set -euo pipefail
          grpcurl_version="1.9.3"
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v${grpcurl_version}/grpcurl_${grpcurl_version}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Register cluster admin identity
        shell: bash
        run: ./.github/scripts/register_cluster_admin_identity.sh

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Deploy from source
        run: devspace dev

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          service: gateway
        env:
          # Cluster admin identity is registered via gRPC earlier.
          AGYN_AGENT_INIT_IMAGE: ghcr.io/agynio/agent-init:v1.0.0
          CODEX_INIT_IMAGE: ghcr.io/agynio/agent-init-codex:0.13
          AGN_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4
          CLAUDE_INIT_IMAGE: ghcr.io/agynio/agent-init-claude:0.1
          AGN_EXPOSE_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4

      - name: Restore ArgoCD auto-sync
        if: always()
        run: devspace run-pipeline restore-argocd
