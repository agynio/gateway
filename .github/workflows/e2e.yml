name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main

      - name: Wait for identity and seed cluster admin
        run: |
          set -euo pipefail

          namespace="platform"
          identity_id="a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10"
          identity_type="1"
          identity_db_selector="app.kubernetes.io/instance=identity-db"

          echo "Waiting for identity-db pod readiness..."
          kubectl wait --for=condition=ready pod -n "${namespace}" \
            -l "${identity_db_selector}" --timeout=5m

          echo "Waiting for identity deployment readiness..."
          kubectl rollout status deployment/identity -n "${namespace}" --timeout=5m

          identity_db_pod=$(kubectl get pods -n "${namespace}" \
            -l "${identity_db_selector}" \
            -o jsonpath='{.items[0].metadata.name}')

          if [[ -z "${identity_db_pod}" ]]; then
            echo "ERROR: identity-db pod not found" >&2
            exit 1
          fi

          table_ready=0
          for i in $(seq 1 30); do
            table_name=$(kubectl exec -n "${namespace}" "${identity_db_pod}" -- \
              env PGPASSWORD=identity psql -U identity -d identity -tAc \
              "SELECT to_regclass('public.identities');" || true)

            if [[ "${table_name}" == "identities" ]]; then
              table_ready=1
              break
            fi

            echo "Waiting for identities table... (${i}/30)"
            sleep 5
          done

          if [[ "${table_ready}" -ne 1 ]]; then
            echo "ERROR: identities table did not become ready" >&2
            exit 1
          fi

          kubectl exec -n "${namespace}" "${identity_db_pod}" -- \
            env PGPASSWORD=identity psql -U identity -d identity -v ON_ERROR_STOP=1 -c \
            "INSERT INTO identities (identity_id, identity_type) VALUES ('${identity_id}', ${identity_type}) \
            ON CONFLICT (identity_id) DO NOTHING;"

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Deploy from source
        run: devspace dev

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          service: gateway

      - name: Restore ArgoCD auto-sync
        if: always()
        run: devspace run-pipeline restore-argocd
